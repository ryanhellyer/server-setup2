# Shared Redis for WP object cache + Laravel sessions/cache.
# Test server default is 64 MB (only 2 GB RAM). On production raise it via
# REDIS_MAXMEMORY in .env (compose passes it as --maxmemory, overriding this).
maxmemory 64mb
maxmemory-policy allkeys-lru

# No persistence needed (it's a cache — the DB is the source of truth).
save ""
appendonly no