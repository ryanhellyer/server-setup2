# =============================================================================
# TEST-ONLY vhost for ionos.hellyer.kiwi — remove this file for production.
# Serves a small PHP diagnostics page that exercises the whole stack
# (nginx -> php-fpm -> mariadb/valkey network).
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name ionos.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	root /var/www/ionos.hellyer.kiwi/public;
	index index.php index.html;

	access_log /var/log/nginx/ionos-test.access.log;
	error_log /var/log/nginx/ionos-test.error.log;

	include /etc/nginx/snippets/security-headers.conf;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include /etc/nginx/snippets/fastcgi-php.conf;
		fastcgi_pass php-fpm;

		fastcgi_cache_bypass $no_cache_final;
		fastcgi_no_cache     $no_cache_final;
		fastcgi_cache PRESSABL;
		fastcgi_cache_valid 200 1m;
	}
}