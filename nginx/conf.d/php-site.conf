# =============================================================================
# PHP-FPM sites — ONE server block per certificate (nginx serves a single cert
# per block). All blocks share the maps below + the php-site-locations snippet,
# so most site changes are a single-line edit. To change PHP socket/version for
# ALL sites at once, edit the `php-fpm` upstream in nginx.conf.
#
#   gpx.hellyer.kiwi, ryan.hellyer.kiwi, kartastrophecup.de, spam-destroyer.com,
#   spam-destroyer.hellyer.kiwi, german.hellyer.kiwi, cvs.hellyer.kiwi, ai.hellyer.kiwi,
#   instantattend.com
#
# Certs: spam-destroyer.hellyer.kiwi gets its own real Let's Encrypt cert
# (own block below); every other domain here shares the self-signed test-all
# cert. deploy.sh seeds a placeholder into live/<name> before nginx starts so
# a not-yet-issued cert degrades to test-all instead of failing the handshake.
#
# To add a site: add it to $site_root + $site_access_log + the server_name
# list (scripts/new-site.sh automates this).
# =============================================================================

map $http_host $site_root {
	hostnames;
	ryan.hellyer.kiwi      /var/www/laravel-ryan.hellyer.kiwi/public;
	gpx.hellyer.kiwi       /var/www/gpx.hellyer.kiwi/public;
	spam-destroyer.com     /var/www/spam-destroyer.com/public;
	spam-destroyer.hellyer.kiwi /var/www/spam-destroyer.hellyer.kiwi/public;
	kartastrophecup.de     /var/www/kartastrophecup.de/public;
	german.hellyer.kiwi    /var/www/german.hellyer.kiwi/public;
	cvs.hellyer.kiwi       /var/www/cvs.hellyer.kiwi/public;
	ai.hellyer.kiwi        /var/www/ai.hellyer.kiwi/public;
	instantattend.com      /var/www/instantattend.com/public;
}

map $http_host $site_access_log {
	hostnames;
	default /var/log/nginx/php-site.access.log;
	ryan.hellyer.kiwi      /var/www/laravel-ryan.hellyer.kiwi/logs/access.log;
	gpx.hellyer.kiwi       /var/www/gpx.hellyer.kiwi/logs/access.log;
	spam-destroyer.com     /var/www/spam-destroyer.com/logs/access.log;
	spam-destroyer.hellyer.kiwi /var/www/spam-destroyer.hellyer.kiwi/logs/access.log;
	kartastrophecup.de     /var/www/kartastrophecup.de/logs/access.log;
	german.hellyer.kiwi    /var/www/german.hellyer.kiwi/logs/access.log;
	cvs.hellyer.kiwi       /var/www/cvs.hellyer.kiwi/logs/access.log;
	ai.hellyer.kiwi        /var/www/ai.hellyer.kiwi/logs/access.log;
	instantattend.com      /var/www/instantattend.com/logs/access.log;
}

# german.hellyer.kiwi intentionally 404s unknown paths instead of routing
# them through the PHP front controller.
map $http_host $site_try_files {
	hostnames;
	default /index.php?$args;
	german.hellyer.kiwi    =404;
}

# ryan-specific extras (scope the shared locations to ryan only, so they
# never affect the other sites served by these blocks).
map $http_host $ryan_extra {
	hostnames;
	default 0;
	ryan.hellyer.kiwi 1;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		gpx.hellyer.kiwi ryan.hellyer.kiwi kartastrophecup.de spam-destroyer.com
		german.hellyer.kiwi cvs.hellyer.kiwi ai.hellyer.kiwi instantattend.com
		# >>> new-site.sh: add php-site domains above this line >>>
		;

	ssl_certificate /etc/letsencrypt/live/test-all/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/test-all/privkey.pem;

	root $site_root;
	index index.php index.html;

	access_log $site_access_log;
	error_log /var/log/nginx/php-site.error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 404 /404.jpg;

	include /etc/nginx/snippets/php-site-locations.conf;
}

# spam-destroyer.hellyer.kiwi — real Let's Encrypt cert (own block; nginx
# serves one cert per block). Shares the maps + locations of the block above.
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name spam-destroyer.hellyer.kiwi;

	ssl_certificate /etc/letsencrypt/live/spam-destroyer.hellyer.kiwi/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/spam-destroyer.hellyer.kiwi/privkey.pem;

	root $site_root;
	index index.php index.html;

	access_log $site_access_log;
	error_log /var/log/nginx/php-site.error.log;

	include /etc/nginx/snippets/security-headers.conf;
	error_page 404 /404.jpg;

	include /etc/nginx/snippets/php-site-locations.conf;
}