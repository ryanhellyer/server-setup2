# =============================================================================
# Node.js proxy — chat.hellyer.kiwi (WebSockets + long AI streams).
#
# To add another Node app: extend the server_name list and point it at its
# own upstream/port.
# =============================================================================

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name
		chat.hellyer.kiwi
		# >>> new-site.sh: add node-proxy domains above this line >>>
		;

	ssl_certificate /etc/letsencrypt/live/pressabl/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pressabl/privkey.pem;

	client_max_body_size 100M;

	access_log /var/log/nginx/node-proxy.access.log;
	error_log /var/log/nginx/node-proxy.error.log;

	include /etc/nginx/snippets/security-headers.conf;

	location / {
		proxy_pass http://node-app;

		# Standard proxy headers.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket support for real-time streaming.
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		# Long timeouts for AI responses.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_connect_timeout 300s;
	}
}