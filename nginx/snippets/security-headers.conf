# Shared security headers.
# Include at server level AND inside any location that defines its own
# add_header (nginx does not inherit add_header from a parent context into
# a location that declares any add_header of its own).
#
# Change once -> every vhost and cached location follows.

add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
add_header X-Xss-Protection "1; mode=block" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

# Debug header showing whether the response came from the fastcgi cache.
add_header X-Cache-Status $upstream_cache_status always;