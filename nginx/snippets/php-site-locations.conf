# Shared locations for the PHP-site server blocks (see conf.d/php-site.conf).
# nginx serves ONE certificate per server block, so php-site.conf splits into
# one block per certificate (spam-destroyer.hellyer.kiwi has a real cert; the
# rest share test-all) — every block includes this, so a change applies to all.
# ryan-only extras are scoped with the $ryan_extra map so they never affect the
# other sites in those blocks.

# ---- ryan.hellyer.kiwi: redirect .jpg/.webp to .avif ----
# (For every other site this location falls through to plain static serving.)
location ~* \.(jpg|webp)$ {
	if ($ryan_extra) { rewrite ^(.+)\.(jpg|webp)$ $1.avif permanent; }

	try_files $uri =404;
	expires 1y;
	add_header Cache-Control "public, immutable";
	access_log off;
	log_not_found off;
	include /etc/nginx/snippets/security-headers.conf;
}

# ---- serve /files/ directly, else route through the front controller ----
# (Matches the original behaviour of every site in these blocks.)
location ~ ^/files/ {
	try_files $uri $uri/ @files_fallback;
}
location @files_fallback {
	rewrite ^ /index.php last;
}

# ---- ryan.hellyer.kiwi: redirect year archive paths to the homepage ----
location ~ "^/\d{4}/$" {
	if ($ryan_extra) { return 301 /; }

	try_files $uri $uri/ $site_try_files;
}

# ---- ryan.hellyer.kiwi: Bluesky DID verification ----
location = /.well-known/atproto-did {
	add_header Content-Type text/plain;
	if ($ryan_extra) { return 200 'did:plc:an43kfun7fbgelqglo3xduyd'; }
}

# ---- security: never execute PHP under /images/ ----
location ~* ^/images/.*\.php$ { return 403; }

# ---- static assets: cache for a year ----
include /etc/nginx/snippets/static-assets.conf;

location / {
	try_files $uri $uri/ $site_try_files;
}

location ~ \.php$ {
	include /etc/nginx/snippets/fastcgi-php.conf;
	fastcgi_pass php-fpm;

	# Shared cache bypass (WP cookies, admin paths, logged-in sessions)
	# OR the per-site kill switch (kartastrophecup.de).
	fastcgi_cache_bypass $no_cache_final $site_no_cache;
	fastcgi_no_cache     $no_cache_final $site_no_cache;
	fastcgi_cache PRESSABL;
	fastcgi_cache_valid 200 1m;
	fastcgi_cache_use_stale error timeout invalid_header http_500;
}