# Root Compose file — full hellyer.kiwi stack.
# Orchestration:  sudo podman compose up -d --build
# (podman-compose also works for older setups.)

services:
  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/modules-enabled:/etc/nginx/modules-enabled:ro
      - ./nginx/mime.types:/etc/nginx/mime.types:ro
      - ./nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
      - ./nginx/fastcgi.conf:/etc/nginx/fastcgi.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - ./env/letsencrypt:/etc/letsencrypt:ro
      - php-socket:/run/php:ro
      - /var/www:/var/www
      - /var/log/nginx:/var/log/nginx
      - /var/cache/nginx:/var/cache/nginx
    depends_on:
      - php
      - node
    networks: [web]
    restart: unless-stopped

  php:
    build: ./php
    container_name: php-fpm
    volumes:
      - ./php/10-opcache.ini:/etc/php/8.5/fpm/conf.d/10-opcache.ini:ro
      - ./php/20-fpm-security.ini:/etc/php/8.5/fpm/conf.d/20-fpm-security.ini:ro
      - ./php/fpm-www.conf:/etc/php/8.5/fpm/pool.d/www.conf:ro
      - php-socket:/run/php
      - /var/www:/var/www
    networks: [web, backend]
    restart: unless-stopped

  node:
    build: ./node
    container_name: node
    volumes:
      - /var/www:/var/www
    networks: [web]
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - /var/lib/mysql:/var/lib/mysql
      - ./maria/init:/docker-entrypoint-initdb.d:ro
      - ./maria/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "${REDIS_MAXMEMORY:-64mb}"]
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-64mb}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [backend]
    restart: unless-stopped

volumes:
  php-socket:

networks:
  web:
  backend:
    internal: true